name: Release

# Publishes @jaingxyz/personal-gmail-mcp to npm with build provenance.
#
# Trigger: push a version tag (vX.Y.Z). The release helper does this for you:
#   npm version patch|minor|major   # bumps package.json, commits, tags vX.Y.Z
#   git push --follow-tags           # pushes the commit AND the tag -> fires this
#
# Manual runs (workflow_dispatch) publish whatever version is in package.json,
# or set dry_run=true to validate + pack without pushing to the registry.
#
# Auth: npm OIDC "trusted publishing" — no NPM_TOKEN secret. The package must
# list this repo + workflow as a trusted publisher on npmjs.com (one-time
# setup). Requires npm >= 11.5.1, which Node 24 bundles (npm 11.16.0), so no
# manual npm upgrade is needed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and pack only; do not publish to npm"
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel an in-flight release; a half-published tag is worse than a wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC: trusted publishing + provenance attestation
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Use 'npm version' so they stay in sync."
            exit 1
          fi

      # Full gate before anything reaches the registry. Mirrors CI; npm's own
      # prepublishOnly hook re-runs build+lint+format+test as a final guard.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Coverage threshold
        run: npm run test:coverage

      - name: Publish to npm (provenance via OIDC)
        if: github.event_name == 'push' || !inputs.dry_run
        run: npm publish --provenance --access public

      - name: Pack only (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --access public

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
